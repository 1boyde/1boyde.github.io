    <style>
        body, html {

        .container {
            display: flex;

            color: white;
            text-align: center;
        }
        h1 {
            font-size: 6em;
            margin: 0;
            animation: fadeIn 2s ease-in-out;
        }

        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .background-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;

            background-size: 50px 50px;
            animation: moveBackground 10s linear infinite;
        }
        @keyframes moveBackground {
            from {
                background-position: 0 0;
            }
            to {

            }
        }
    </style>
